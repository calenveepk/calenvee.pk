**Date of Audit:** October 15, 2026  
**Auditor:** Principal Software Architect & Staff QA/Security Engineer  
**System Under Review:** Calenvee.pk E-Commerce Platform (Web Storefront, Desktop Admin CMS, Google Sheets Backend, Google Drive Storage, Gmail Dispatch Automations)  
**Target Market:** Pakistan (Direct-to-Consumer / Cash on Delivery & Advance Mobile Wallets)  
**Audit Mode:** Read-Only Static Analysis & Live Endpoint Dynamic Probing

## 1. EXECUTIVE SUMMARY & LAUNCH-READINESS VERDICT

### **VERDICT: NO-GO (CRITICAL BLOCKERS REQUIRE IMMEDIATE REMEDIATION BEFORE PUBLIC LAUNCH)**

> **Reason in 3 Lines:**
> 1. **Critical Security & PII Exposure:** The public Google Apps Script endpoint allows unauthenticated dumping of complete customer personal data (names, phone numbers, home addresses, orders) via a simple GET request.
> 2. **Financial Exploitation Risk:** Order totals, item prices, and discounts are trusted completely from client-side payload without server-side validation or recalculation, enabling trivial price tampering to Rs. 1.
> 3. **Concurrency & Quota Failure:** Google Apps Script lacks distributed locking (causing duplicate/colliding order IDs under concurrent checkouts) and operates on a free Gmail account that hard-caps out at 50 orders/day (100 emails/day quota).

## 6. BROKEN-CHAIN & ORPHAN AUDIT

### Broken Chains (Where step N fails to hand over to step N+1):
1. **Order Creation ➔ Inventory Deduction:**
   - Step: Customer orders product (e.g., 2 units of Obsidian Chrono Watch).
   - Expected: `Inventory` tab stock count decreases by 2.
   - Reality: Hand-off does not exist. `handleCreateOrder` finishes without touching the `Inventory` tab.
2. **Offline Fallback ➔ Merchant Notification:**
   - Step: Customer checkout encounters webhook timeout or cold start abort (> 12s).
   - Expected: System queues the order and retries in the background until merchant receives it.
   - Reality: Hand-off breaks. Order is dumped into `localStorage` and marked as "success" on screen. The merchant never receives the order.
3. **UI Email Requirement ➔ Form Validation:**
   - Step: Customer reads "Email Address (Optional)" and leaves field blank.
   - Expected: Form submits successfully without email, sending invoice via WhatsApp instead.
   - Reality: Validation interceptor abruptly calls `alert(...)` and stops execution.
4. **Sitemap ➔ Route Resolution:**
   - Step: Search crawler requests `https://calenvee.pk/track-order`.
   - Expected: Renders Order Tracking page.
   - Reality: Hand-off breaks. Route does not exist; falls through to `HomePage.tsx`.

### Orphaned / Dead Assets:
1. **`src/services/shopify.ts`:** 168 lines of dead Shopify GraphQL code. Not imported by any file.
2. **`ProductDetailPage.tsx:46` (`setQuantity`):** State setter is initialized but has no bound button, slider, or input in the JSX.
3. **`public/invoice-preview.html`:** Static standalone file (19.7 KB) not linked from navigation or router.

## 7. PAKISTAN MARKET READINESS & COD SPECIFICS

1. **Cash on Delivery (COD) Fraud & RTO Vulnerability:**
   - In Pakistan, unverified COD orders suffer a **25%–35% Return to Origin (RTO)** rate if phone numbers are not strictly verified.
   - Because Calenvee allows any text in the phone input and generates an automated order without OTP/SMS verification, prank orders will cause direct courier shipping charge losses (couriers charge Rs. 250–350 return shipping even if parcel is rejected).
   - **Recommendation:** Implement mandatory 11-digit mobile validation (`03XXXXXXXXX`), and utilize the WhatsApp confirmation call step (already indicated in dashboard) before moving status from "Placed" to "Confirmed".
2. **WhatsApp Reliance:**
   - The integration with WhatsApp (`https://wa.me/923001234567`) is present in the header, footer, product page, order completed screen, and returns page. This aligns well with Pakistani consumer habits.
   - **Observation:** Ensure the actual active WhatsApp business number is configured in `src/data/storeSettings.json` before launch (currently placeholder `+923001234567`).
